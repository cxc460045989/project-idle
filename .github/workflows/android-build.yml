name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - run: npm ci
      - run: npm run build
      
      - name: Build APK with Capacitor
        uses: capgo/action@v4
        with:
          packagePath: '.'
          artifactName: app-debug.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.sha }}
          path: app-debug.apk
