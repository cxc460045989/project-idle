name: Build Android APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - run: npm ci
      - run: npm run build
      
      - name: Install Capacitor
        run: npm install -D @capacitor/core @capacitor/cli @capacitor/android
      
      - name: Create capacitor.config.json
        run: |
          echo '{"appId":"com.idle.reincarnation","appName":"IdleReincarnation","webDir":"dist"}' > capacitor.config.json
      
      - name: Add Android
        run: npx cap add android
      
      - name: Sync
        run: npx cap sync android
      
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Build APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --no-parallel --no-configuration-cache
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
